title: Jurnal de parcurs — Sistem EDR
description: Povestea din spatele fiecărei decizii și al fiecărui bug
author: Țilică Gabriel-Lucian

url: "https://ZiGabiZi.github.io"
baseurl: "/edr-journal"
github_user: ZiGabiZi   # folosit pentru link-urile din `commits`

theme: minima

exclude:
  - scripts/       # unealtă de build, nu conținut publicabil
  - Gemfile
  - Gemfile.lock

collections:
  intrari:
    output: true
    permalink: /intrari/:name/

defaults:
  - scope:
      path: ""
      type: intrari
    values:
      layout: intrare
