title: Jurnal de parcurs — Sistem EDR
description: Povestea din spatele fiecărei decizii și al fiecărui bug
author: Țilică Gabriel-Lucian

url: "https://ZiGabiZi.github.io"
baseurl: "/edr-journal"
github_user: ZiGabiZi   # folosit pentru link-urile din `commits`

theme: minima

# Datele intrarilor sunt scrise in ora locala a autorului (UTC+3), iar GitHub
# Pages compileaza in UTC. Fara cele doua linii de mai jos, o intrare scrisa
# dupa ora 21:00 locala apare in liste dar pagina ei nu se scrie: Jekyll o
# considera datata in viitor si o exclude din documentele scrise, desi o
# pastreaza in site.intrari. Simptomul e 404 pe un link care exista in index.
timezone: Europe/Bucharest
future: true

exclude:
  - scripts/       # unealtă de build, nu conținut publicabil
  - Gemfile
  - Gemfile.lock

collections:
  intrari:
    output: true
    permalink: /intrari/:name/

defaults:
  - scope:
      path: ""
      type: intrari
    values:
      layout: intrare
