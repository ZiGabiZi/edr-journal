# Vocabularul închis de tag-uri, ca sursă unică de adevăr.
#
# Adaugi o temă nouă aici ÎNTÂI, apoi o folosești în intrări. Orice tag
# apărut într-o intrare dar absent de aici e semnalat pe /teme/ ca necunoscut.
# La adăugarea unei teme, creează și fișierul stub `teme/<nume>.md`.

- nume: retea
  titlu: Rețea
  descriere: Transport HTTP, timeout-uri, reîncercări, comportament la server indisponibil.

- nume: contract
  titlu: Contract
  descriere: Ce își promit agentul și serverul pe fir și cum se verifică promisiunea — nume de câmpuri, obligativitate, invariante interzise.

- nume: concurenta
  titlu: Concurență
  descriere: Fire de execuție, stare partajată, ordonare, condiții de cursă.

- nume: persistenta
  titlu: Persistență
  descriere: Ce supraviețuiește unei reporniri și ce se pierde — cozi, store-uri, scriere pe disc.

- nume: identitate
  titlu: Identitate
  descriere: Cine e agentul și care e evenimentul — înregistrare, chei de deduplicare, corelare.

- nume: observabilitate
  titlu: Observabilitate
  descriere: Loguri, contoare și stare vizibilă din afara procesului.

- nume: detectie
  titlu: Detecție
  descriere: Ce ajunge să fie observat pe endpoint și ce trece neobservat — evenimente de fișier, filtrare, suprimare, goluri de acoperire.

- nume: reputatie
  titlu: Reputație
  descriere: Ce se știe despre un fișier înainte de orice analiză — surse externe, prevalență în parc, și separarea dintre „cunoscut ca software" și „cunoscut ca amenințare".

- nume: pdp
  titlu: PDP
  descriere: Protocol de divulgare progresivă — divulgarea în trepte a datelor despre un fișier, guvernată de banda de incertitudine.

- nume: infrastructura
  titlu: Infrastructură
  descriere: Tooling, build, publicare și mediul de dezvoltare.
